services:
  paperlesspaper-art:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      ART_ASSET_BASE_URL: ${ART_ASSET_BASE_URL:-}
      ART_ALLOWED_ORIGINS: ${ART_ALLOWED_ORIGINS:-*}
      ART_API_KEY: ${ART_API_KEY:-}
    ports:
      - "3000:3000"
